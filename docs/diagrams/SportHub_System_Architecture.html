<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SportHub System Architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: #FFFFFF;
      display: inline-block;
      color: #111827;
    }
    .canvas-wrap {
      background: #FFFFFF;
      width: 1200px;
      height: 720px;
      position: relative;
      overflow: hidden;
    }
    .box {
      position: absolute;
      border: 1.5px solid #4B5563;
      border-radius: 8px;
      background: #FFFFFF;
    }
    .box-label {
      position: absolute;
      top: 12px;
      left: 16px;
      font-size: 13.5px;
      font-weight: 600;
      color: #111827;
    }
    .card {
      position: absolute;
      border: 1.4px solid #4B5563;
      border-radius: 7px;
      background: #FFFFFF;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 10px 8px;
      text-align: center;
    }
    .card-title {
      font-size: 11.5px;
      font-weight: 600;
      color: #111827;
      margin-bottom: 6px;
      line-height: 1.25;
      align-self: flex-start;
      padding-left: 4px;
    }
    .logo-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      margin: auto;
    }
    svg.connections {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 5;
    }
    .conn-label {
      font-family: 'Inter', sans-serif;
      font-size: 11px;
      font-weight: 500;
      fill: #111827;
    }
  </style>
</head>
<body>
  <div class="canvas-wrap" id="diagram-canvas">

    <!-- ==================== 1. CLIENT SIDE ==================== -->
    <div class="box" style="left: 190px; top: 28px; width: 470px; height: 145px;">
      <div class="box-label">CLIENT SIDE</div>

      <!-- Single Real Web App Card: React 19 + Vite 8 + Tailwind CSS -->
      <div class="card" style="left: 115px; top: 24px; width: 270px; height: 98px;">
        <div class="card-title" style="align-self:center;padding-left:0;">Web App - React 19 + Vite 8 + Tailwind CSS</div>
        <div class="logo-row">
          <!-- React SVG -->
          <svg width="44" height="44" viewBox="-11.5 -10.23174 23 20.46348">
            <circle cx="0" cy="0" r="2.05" fill="#61dafb"/>
            <g stroke="#61dafb" stroke-width="1" fill="none">
              <ellipse rx="11" ry="4.2"/>
              <ellipse rx="11" ry="4.2" transform="rotate(60)"/>
              <ellipse rx="11" ry="4.2" transform="rotate(120)"/>
            </g>
          </svg>
          <!-- Vite SVG -->
          <svg width="40" height="40" viewBox="0 0 256 257">
            <defs>
              <linearGradient id="vite1" x1="-.828%" x2="57.636%" y1="7.652%" y2="78.411%">
                <stop offset="0%" stop-color="#41D1FF"/><stop offset="100%" stop-color="#BD34FE"/>
              </linearGradient>
              <linearGradient id="vite2" x1="43.376%" x2="50.316%" y1="2.242%" y2="89.03%">
                <stop offset="0%" stop-color="#FFEA83"/><stop offset="8.333%" stop-color="#FFDD35"/><stop offset="100%" stop-color="#FFA800"/>
              </linearGradient>
            </defs>
            <path fill="url(#vite1)" d="M255.153 37.938L134.897 252.976c-2.483 4.44-8.862 4.466-11.382.048L.875 37.958c-2.746-4.814 1.371-10.646 6.827-9.67l120.385 21.517a6.537 6.537 0 0 0 2.322-.004l117.867-21.483c5.438-.991 9.574 4.796 6.877 9.62Z"/>
            <path fill="url(#vite2)" d="M185.432.063L96.44 17.501a3.268 3.268 0 0 0-2.634 3.014l-5.474 92.456a3.268 3.268 0 0 0 3.997 3.378l24.777-5.718c2.318-.535 4.413 1.507 3.936 3.838l-7.361 36.047c-.495 2.426 1.782 4.5 4.151 3.78l15.304-4.649c2.372-.72 4.652 1.36 4.15 3.788l-11.698 56.621c-.732 3.542 3.979 5.473 5.943 2.437l1.313-2.028l72.516-144.72c1.215-2.423-.88-5.186-3.54-4.672l-25.505 4.922c-2.396.462-4.435-1.77-3.759-4.114l16.646-57.705c.677-2.35-1.37-4.583-3.769-4.113Z"/>
          </svg>
          <!-- Tailwind CSS SVG -->
          <svg width="44" height="44" viewBox="0 0 24 24" fill="none">
            <path fill="#06B6D4" d="M12.001 4.8c-3.2 0-5.2 1.6-6 4.8 1.2-1.6 2.6-2.2 4.2-1.8.913.228 1.565.89 2.288 1.624C13.666 10.618 15.027 12 18.001 12c3.2 0 5.2-1.6 6-4.8-1.2 1.6-2.6 2.2-4.2 1.8-.913-.228-1.565-.89-2.288-1.624C16.337 6.182 14.976 4.8 12.001 4.8zm-6 7.2c-3.2 0-5.2 1.6-6 4.8 1.2-1.6 2.6-2.2 4.2-1.8.913.228 1.565.89 2.288 1.624 1.177 1.194 2.538 2.576 5.512 2.576 3.2 0 5.2-1.6 6-4.8-1.2 1.6-2.6 2.2-4.2 1.8-.913-.228-1.565-.89-2.288-1.624C10.337 13.382 8.976 12 6.001 12z"/>
          </svg>
        </div>
      </div>
    </div>

    <!-- ==================== 2. SERVER SIDE BOX ==================== -->
    <div class="box" style="left: 80px; top: 230px; width: 700px; height: 460px; border-radius: 10px;">
      <div class="box-label">SERVER SIDE</div>

      <!-- ==================== BACKEND INNER BOX ==================== -->
      <div class="box" style="left: 85px; top: 50px; width: 530px; height: 230px;">
        <div class="box-label" style="font-size:14.5px;">Backend</div>

        <!-- Sub-box 1: Rest api (spring-boot-starter-webmvc) -->
        <div class="card" style="left: 26px; top: 45px; width: 105px; height: 92px;">
          <div class="card-title">Rest api</div>
          <div class="logo-row">
            <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#1E293B" stroke-width="1.6">
              <polygon points="12 2 21 7 21 17 12 22 3 17 3 7 12 2"/>
              <text x="12" y="14.5" text-anchor="middle" fill="#1E293B" stroke="none" font-size="6.8" font-weight="800">REST</text>
            </svg>
          </div>
        </div>

        <!-- Sub-box 2: Spring Security (spring-boot-starter-security) -->
        <div class="card" style="left: 150px; top: 45px; width: 105px; height: 92px;">
          <div class="card-title">Spring Security</div>
          <div class="logo-row">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none">
              <path d="M12 2L4 5v6.09c0 5.05 3.41 9.76 8 10.91 4.59-1.15 8-5.86 8-10.91V5l-8-3z" fill="#6DB33F"/>
              <path d="M10.5 14.5l-2.5-2.5 1.4-1.4 1.1 1.1 3.6-3.6 1.4 1.4-5 5z" fill="#FFFFFF"/>
            </svg>
          </div>
        </div>

        <!-- Sub-box 3: Spring Data JPA (spring-boot-starter-data-jpa) -->
        <div class="card" style="left: 274px; top: 45px; width: 105px; height: 92px;">
          <div class="card-title">Spring Data JPA</div>
          <div class="logo-row">
            <svg width="42" height="42" viewBox="0 0 24 24" fill="none">
              <ellipse cx="12" cy="6" rx="8" ry="3.5" fill="#EA580C"/>
              <path d="M4 6v6c0 1.93 3.58 3.5 8 3.5s8-1.57 8-3.5V6" fill="#FB923C" fill-opacity="0.35" stroke="#EA580C" stroke-width="1.5"/>
              <path d="M4 12v6c0 1.93 3.58 3.5 8 3.5s8-1.34 8-3.5v-6" fill="#FB923C" fill-opacity="0.2" stroke="#EA580C" stroke-width="1.5"/>
            </svg>
          </div>
        </div>

        <!-- Sub-box 4: Task Scheduler (@Scheduled in Spring Boot) -->
        <div class="card" style="left: 398px; top: 45px; width: 105px; height: 92px;">
          <div class="card-title">Task Scheduler</div>
          <div class="logo-row">
            <svg width="68" height="30" viewBox="0 0 90 36" fill="none">
              <rect x="2" y="4" width="86" height="28" rx="4" fill="#0284C7"/>
              <text x="45" y="22" text-anchor="middle" fill="#fff" font-size="12" font-weight="800">@Scheduled</text>
            </svg>
          </div>
        </div>

        <!-- Bottom-left framework badge inside Backend -->
        <div style="position:absolute; left: 22px; bottom: 16px; display:flex; align-items:center; gap: 10px;">
          <svg width="36" height="36" viewBox="0 0 24 24">
            <polygon points="12 1 22 6.5 22 17.5 12 23 2 17.5 2 6.5 12 1" fill="#6DB33F"/>
            <path d="M12 6.5a5.5 5.5 0 1 0 5.5 5.5h-2a3.5 3.5 0 1 1-3.5-3.5V6.5z" fill="#fff"/>
            <circle cx="15.5" cy="8.5" r="1.3" fill="#fff"/>
          </svg>
          <svg width="36" height="36" viewBox="0 0 24 24" fill="none">
            <polygon points="12 1 22 6.5 22 17.5 12 23 2 17.5 2 6.5 12 1" stroke="#1E293B" stroke-width="1.6" fill="#fff"/>
            <text x="12" y="15" text-anchor="middle" fill="#1E293B" font-size="8" font-weight="800">J21</text>
          </svg>
          <span style="font-size:11.5px; font-weight:700; color:#111827;">Java 21 + Spring Boot 4.1.2</span>
        </div>
      </div>

      <!-- ==================== DATABASE (ONLY SQL SERVER) ==================== -->
      <div class="card" style="left: 345px; top: 335px; width: 135px; height: 104px;">
        <div class="card-title" style="align-self:center;padding-left:0;">MS SQL Server</div>
        <div class="logo-row">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none">
            <ellipse cx="12" cy="5" rx="8" ry="3" fill="#DC2626"/>
            <path d="M4 5v4.5c0 1.66 3.58 3 8 3s8-1.34 8-3V5" fill="#EF4444" fill-opacity="0.85"/>
            <path d="M4 9.5v4.5c0 1.66 3.58 3 8 3s8-1.34 8-3V9.5" fill="#DC2626" fill-opacity="0.9"/>
            <path d="M4 14v4.5c0 1.66 3.58 3 8 3s8-1.34 8-3V14" fill="#991B1B"/>
          </svg>
        </div>
      </div>
    </div>

    <!-- ==================== 3. EXTERNAL SERVICE BOX (ONLY 3 REAL SERVICES) ==================== -->
    <div class="box" style="left: 910px; top: 230px; width: 220px; height: 460px; border-radius: 10px;">
      <div class="box-label" style="font-size:14px;">External service</div>

      <!-- 1. VNPay Sandbox -->
      <div class="card" style="left: 46px; top: 55px; width: 128px; height: 105px;">
        <div class="card-title">Payment</div>
        <div class="logo-row">
          <svg width="62" height="44" viewBox="0 0 100 60">
            <polygon points="25,10 48,10 35,34 12,34" fill="#E11D48"/>
            <polygon points="48,10 78,10 62,38 35,34" fill="#0284C7"/>
            <text x="50" y="54" text-anchor="middle" font-size="15" font-weight="800" fill="#0369A1">VNPAY</text>
          </svg>
        </div>
      </div>

      <!-- 2. Google Gemini API -->
      <div class="card" style="left: 46px; top: 185px; width: 128px; height: 105px;">
        <div class="card-title">Google Gemini AI</div>
        <div class="logo-row">
          <svg width="46" height="46" viewBox="0 0 24 24" fill="none">
            <defs>
              <linearGradient id="gemini" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#3B82F6"/>
                <stop offset="50%" stop-color="#8B5CF6"/>
                <stop offset="100%" stop-color="#EC4899"/>
              </linearGradient>
            </defs>
            <path d="M12 2C12 7.5 7.5 12 2 12C7.5 12 12 16.5 12 22C12 16.5 16.5 12 22 12C16.5 12 12 7.5 12 2Z" fill="url(#gemini)"/>
          </svg>
        </div>
      </div>

      <!-- 3. Gmail SMTP -->
      <div class="card" style="left: 46px; top: 315px; width: 128px; height: 105px;">
        <div class="card-title">Gmail SMTP</div>
        <div class="logo-row">
          <svg width="48" height="38" viewBox="0 0 48 36">
            <path fill="#4285F4" d="M3 6v27h8V15L3 6z"/>
            <path fill="#34A853" d="M37 15v18h8V6l-8 9z"/>
            <path fill="#FBBC05" d="M37 6v9l8-6V6a3 3 0 0 0-5-2.2L37 6z"/>
            <path fill="#EA4335" d="M11 15l13 10 13-10V6L24 16 11 6v9z"/>
            <path fill="#C5221F" d="M3 6v3l8 6V6L8 3.8A3 3 0 0 0 3 6z"/>
          </svg>
        </div>
      </div>
    </div>

    <!-- ==================== SVG ARROWS & LABELS ==================== -->
    <svg class="connections">
      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
          <path d="M 0 1 L 10 5 L 0 9 z" fill="#1F2937"/>
        </marker>
      </defs>

      <!-- 1. Client Side -> Rest api (HTTP/REST API + Bearer Token) -->
      <line x1="265" y1="173" x2="265" y2="325" stroke="#1F2937" stroke-width="1.4" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
      <rect x="185" y="196" width="160" height="18" fill="#FFFFFF"/>
      <text x="265" y="209" text-anchor="middle" class="conn-label">HTTP/REST + Bearer Token</text>

      <!-- 2. Spring Data JPA -> MS SQL Server (JDBC / save & query data) -->
      <line x1="491" y1="417" x2="491" y2="565" stroke="#1F2937" stroke-width="1.4" marker-end="url(#arrow)"/>
      <rect x="445" y="518" width="92" height="16" fill="#FFFFFF"/>
      <text x="491" y="530" text-anchor="middle" class="conn-label">save / query data</text>

      <!-- 3. Task Scheduler -> MS SQL Server (auto release expired slots) -->
      <path d="M 615 417 L 615 617 L 545 617" fill="none" stroke="#1F2937" stroke-width="1.4" marker-end="url(#arrow)"/>
      <rect x="565" y="518" width="100" height="16" fill="#FFFFFF"/>
      <text x="615" y="530" text-anchor="middle" class="conn-label">clean expired lock</text>

      <!-- 4. Backend <-> External Service (HTTPS API / SMTP) -->
      <line x1="780" y1="400" x2="910" y2="400" stroke="#1F2937" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
      <text x="845" y="391" text-anchor="middle" class="conn-label">HTTPS API / SMTP</text>
    </svg>
  </div>
</body>
</html>
