<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SportHub System Architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: #FFFFFF;
      display: inline-block;
      color: #111827;
    }
    .canvas-wrap {
      background: #FFFFFF;
      width: 1200px;
      height: 720px;
      position: relative;
      overflow: hidden;
    }
    .box {
      position: absolute;
      border: 1.5px solid #4B5563;
      border-radius: 8px;
      background: #FFFFFF;
    }
    .box-label {
      position: absolute;
      top: 12px;
      left: 16px;
      font-size: 13.5px;
      font-weight: 600;
      color: #111827;
    }
    .card {
      position: absolute;
      border: 1.4px solid #4B5563;
      border-radius: 7px;
      background: #FFFFFF;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 10px 8px;
      text-align: center;
    }
    .card-title {
      font-size: 11.5px;
      font-weight: 600;
      color: #111827;
      margin-bottom: 6px;
      line-height: 1.25;
      align-self: flex-start;
      padding-left: 4px;
    }
    .logo-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      margin: auto;
    }
    svg.connections {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 5;
    }
    .conn-label {
      font-family: 'Inter', sans-serif;
      font-size: 11px;
      font-weight: 500;
      fill: #111827;
    }
    .conn-label-resp {
      font-family: 'Inter', sans-serif;
      font-size: 11px;
      font-weight: 500;
      fill: #334155;
    }
  </style>
</head>
