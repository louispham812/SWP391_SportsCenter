name: Block PR to Main

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited]
    branches:
      - main

permissions:
  pull-requests: write

jobs:
  block-pr:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login != 'louispham812'
    steps:
      - name: Block and Close PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr comment "$PR_URL" --body "Không được phép tạo PR vào nhánh \`main\`. Vui lòng đổi base branch sang \`develop\`."
          gh pr close "$PR_URL"
          exit 1
