spring.config.import=optional:file:.env[.properties],optional:file:backend/.env[.properties]

server.port=8080
spring.application.name=backend

# Error Handling Configuration
server.error.include-message=always
server.error.include-binding-errors=always

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=SportsCenterDB;encrypt=false;trustServerCertificate=true;sendStringParametersAsUnicode=true;characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:12345}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Hibernate Config
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# HTTP Encoding Configuration (Fix Vietnamese characters)
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
spring.http.encoding.charset=UTF-8
spring.http.encoding.enabled=true
spring.http.encoding.force=true

# Initialize the public home-page content tables and seed records idempotently.
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

# AI assistant integration; defaults to Google Gemini via OpenAI-compatible endpoint.
app.openai.api-key=${GEMINI_API_KEY:${OPENAI_API_KEY:}}
app.openai.model=${GEMINI_MODEL:${OPENAI_MODEL:gemini-flash-lite-latest}}
app.openai.base-url=${AI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai/chat/completions}

# Email Configuration (SMTP Gmail)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.from-name=${MAIL_FROM_NAME:SportHub Support}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# VNPay Configuration
vnpay.tmn-code=${VNPAY_TMN_CODE:}
vnpay.hash-secret=${VNPAY_HASH_SECRET:}
vnpay.url=${VNPAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
vnpay.return-url=${VNPAY_RETURN_URL:http://localhost:5174/payment/return}
vnpay.ipn-url=${VNPAY_IPN_URL:http://localhost:8080/api/v1/webhooks/vnpay/ipn}

# VNPay API URL for refund
vnpay.api-url=${VNPAY_API_URL}
