server.port=8080
spring.application.name=backend

# Chuỗi kết nối SQLEXPRESS
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=SportsCenterDB;encrypt=false;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=12345
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Hibernate Config
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# Initialize the public home-page content tables and seed records idempotently.
spring.sql.init.mode=always

# AI assistant integration; set OPENAI_API_KEY in the backend environment.
app.openai.api-key=${OPENAI_API_KEY:}
app.openai.model=${OPENAI_MODEL:gpt-4o-mini}

# Email Configuration (SMTP Gmail)
