spring.config.import=optional:file:.env[.properties],optional:file:backend/.env[.properties]

server.port=8080
spring.application.name=backend

# Error Handling Configuration
server.error.include-message=always
server.error.include-binding-errors=always

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=SportsCenterDB;encrypt=false;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:12345}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Hibernate Config
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# Initialize the public home-page content tables and seed records idempotently.
spring.sql.init.mode=always

# AI assistant integration; defaults to Google Gemini via OpenAI-compatible endpoint.
app.openai.api-key=${GEMINI_API_KEY:${OPENAI_API_KEY:}}
app.openai.model=${GEMINI_MODEL:${OPENAI_MODEL:gemini-flash-lite-latest}}
app.openai.base-url=${AI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai/chat/completions}

# Email Configuration (SMTP Gmail)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.from-name=${MAIL_FROM_NAME:SportHub Support}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
